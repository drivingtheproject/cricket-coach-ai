name: cricket_coach_ai
description: AI cricket coach - on-device pose analysis with local and cloud LLM feedback.
publish_to: 'none'
version: 0.4.0+4

environment:
  sdk: ^3.5.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.0.0
  sqflite: ^2.4.0
  path: ^1.9.0
  crypto: ^3.0.5
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  video_player: ^2.9.2
  video_thumbnail_gen: ^0.6.3
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  google_mlkit_pose_detection: ^0.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  fonts:
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
