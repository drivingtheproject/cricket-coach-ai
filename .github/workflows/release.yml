name: Release build

# Builds the release APK for 64-bit ARM phones (the only kind the app
# supports) and commits it to builds/ on main, replacing the previous one.
# Run it from the Actions tab.
# The APK is signed with the debug key until a release keystore is set up.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi --target-platform android-arm64
      - name: Copy the APK into builds/
        run: |
          mkdir -p builds
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk builds/cricket-coach.apk
          size=$(stat -c %s builds/cricket-coach.apk)
          echo "APK size: $size bytes"
          # GitHub rejects files over 100 MB.
          if [ "$size" -gt 95000000 ]; then
            echo "::error::The APK is too large to commit to the repository."
            exit 1
          fi
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)
          {
            echo "# Builds"
            echo
            echo "\`cricket-coach.apk\` is the latest release build of \`main\`, for"
            echo "64-bit Android phones running Android 11 or newer."
            echo
            echo "- Version: $version"
            echo "- Built from: $GITHUB_SHA"
            echo "- Built on: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "It is signed with a debug key, so Android asks you to allow"
            echo "installs from this source. Not for the Play Store."
          } > builds/README.md
      - uses: actions/upload-artifact@v4
        with:
          name: cricket-coach-apk
          path: builds/cricket-coach.apk
      - name: Commit to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/
          git diff --cached --quiet && exit 0
          git commit -m "Update APK build [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
