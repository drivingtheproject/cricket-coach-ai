name: Release build

# Builds an installable Android APK on demand. Run it from the Actions tab.
# The APK is signed with the debug key until a release keystore is set up.
on:
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cricket-coach-apk
          path: build/app/outputs/flutter-apk/app-release.apk
